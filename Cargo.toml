[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/types",
    "crates/storage",
    "crates/catalog",
    "crates/sql",
    "crates/txn",
    "crates/planner",
    "crates/executor",
    "crates/engine",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/simple_rdbms"
publish = false

[workspace.dependencies]
common = { path = "crates/common" }
types = { path = "crates/types" }
storage = { path = "crates/storage" }
catalog = { path = "crates/catalog" }
sql = { path = "crates/sql" }
txn = { path = "crates/txn" }
planner = { path = "crates/planner" }
executor = { path = "crates/executor" }
engine = { path = "crates/engine" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
proptest = "1"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"