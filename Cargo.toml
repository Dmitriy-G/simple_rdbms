[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/types",
    "crates/storage",
    "crates/catalog",
    "crates/sql",
    "crates/txn",
    "crates/planner",
    "crates/executor",
    "crates/engine",
    "crates/cli",
    "crates/server",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/example/simple_rdbms"
publish = false

[workspace.dependencies]
common = { path = "crates/common" }
types = { path = "crates/types" }
storage = { path = "crates/storage" }
catalog = { path = "crates/catalog" }
sql = { path = "crates/sql" }
txn = { path = "crates/txn" }
planner = { path = "crates/planner" }
executor = { path = "crates/executor" }
engine = { path = "crates/engine" }
test-support = { path = "crates/test-support" }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
proptest = "1"
rand = "0.9"
serde_json = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
ctrlc = { version = "3", features = ["termination"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"