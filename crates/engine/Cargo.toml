[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `Database::open_with_devices`, for the crash-injection harness in
# `tests/crash_injection.rs` to open a database against fault-injecting
# `BlockDevice`s rather than real files. Same rationale as `storage`'s own
# `test-util` feature: `#[cfg(test)]` alone doesn't apply when this crate's
# integration tests link against a normal build of it.
test-util = []

[dependencies]
common = { workspace = true }
types = { workspace = true }
storage = { workspace = true }
catalog = { workspace = true }
sql = { workspace = true }
txn = { workspace = true }
planner = { workspace = true }
executor = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
engine = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
