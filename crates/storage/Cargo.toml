[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes `BufferPool`'s fetch counter to other crates' own tests, since
# `#[cfg(test)]` alone only applies when compiling this crate's own test
# binaries, not when it's pulled in as an ordinary dependency by another
# crate's tests.
test-util = []

[dependencies]
common = { workspace = true }
types = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Self-referenced with `test-util` enabled so this crate's own integration
# tests (under `tests/`) can see `BufferPool`'s test-only instrumentation:
# they link against a normal (non-`--cfg test`) build of this library, the
# same as any other crate's tests would.
storage = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
proptest = { workspace = true }